name: Update database
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["supabase/schema.sql"]
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply supabase/schema.sql
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "SUPABASE_DB_URL secret not set"; exit 1; fi
          sudo apt-get install -y -qq postgresql-client > /dev/null
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
          echo "Database is up to date."
