name: Re-sort lots into categories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [collectors/categorize.mjs]

jobs:
  recategorize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wait for the database update to finish
        run: sleep 90
      - run: node collectors/recategorize.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
