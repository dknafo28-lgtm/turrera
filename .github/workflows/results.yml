name: Final prices of ended auctions (manual backfill)

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many ended lots to check"
        default: "700"

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node collectors/results.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESULTS_PER_RUN: ${{ inputs.count }}
