name: Preview check (temporary)
on:
  push:
    branches: [sold]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm i --no-save puppeteer-core@23
      - name: Final prices (first batch)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESULTS_PER_RUN: "120"
        run: node collectors/results.mjs
      - run: npx next build
      - name: Screenshots
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_PASSWORD: previewcheck
        run: |
          npx next start -p 3123 > /tmp/next.log 2>&1 &
          sleep 10
          export CHROME=$(which google-chrome || which chromium)
          for u in "/" "/search?status=sold" "/our-sales" "/buy-for-me"; do curl -s -o /dev/null -w "$u -> %{http_code}\n" "http://localhost:3123$u"; done
          curl -s -u x:previewcheck -o /dev/null -w "/admin -> %{http_code}\n" "http://localhost:3123/admin"
          node scripts/iphone-audit.mjs http://localhost:3123 / "/search?status=sold" /our-sales
          mkdir -p shots
          $CHROME --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=1400,2600 --screenshot=shots/d-home.png "http://localhost:3123/" 2>/dev/null
          $CHROME --headless=new --disable-gpu --hide-scrollbars --virtual-time-budget=8000 --window-size=1400,1400 --screenshot=shots/d-sold.png "http://localhost:3123/search?status=sold" 2>/dev/null
          grep -i "error" /tmp/next.log | grep -v DEP0 | head -5 || true
      - name: Save screenshots
        if: always()
        run: |
          cp -r shots /tmp/shots || true
          git config user.name "turrera-bot"; git config user.email "bot@turrera.com"
          git checkout --orphan preview-shots
          git rm -rq --cached . && rm -rf ./* .github .gitignore
          cp /tmp/shots/*.png . && git add *.png && git commit -qm "Screenshots" && git push -f origin preview-shots
